<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2B2333" />
    <title>Cuándo Florece · el mapa vivo de la floración</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F0B35A'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Aviso de arranque: se ve hasta que React pinta la app. Si el JavaScript no llega a ejecutarse, se queda con un mensaje útil. -->
    <style>
      body{margin:0;background:#2B2333;color:#FAF7F0;font-family:Inter,system-ui,sans-serif}
      .arranque{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;box-sizing:border-box;text-align:center}
      .arranque h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.4rem;margin:0}
      .arranque p{margin:0;max-width:34em;color:#C9C0D4;line-height:1.5}
      .arranque-lento{opacity:0;animation:arranque-ver .4s 8s forwards}
      @keyframes arranque-ver{to{opacity:1}}
    </style>
    <noscript><style>#root{display:none}</style></noscript>
  </head>
  <body>
    <div id="root">
      <div class="arranque" role="status">
        <svg width="48" height="48" viewBox="-16 -16 32 32" aria-hidden="true"><g fill="#A98BD9"><ellipse cy="-8" rx="4.6" ry="8"/><ellipse cy="-8" rx="4.6" ry="8" transform="rotate(60)"/><ellipse cy="-8" rx="4.6" ry="8" transform="rotate(120)"/><ellipse cy="-8" rx="4.6" ry="8" transform="rotate(180)"/><ellipse cy="-8" rx="4.6" ry="8" transform="rotate(240)"/><ellipse cy="-8" rx="4.6" ry="8" transform="rotate(300)"/></g><circle r="3.6" fill="#2B2333"/></svg>
        <h1>Cuándo Florece</h1>
        <p>Cargando el mapa vivo de la floración…</p>
        <p class="arranque-lento">¿Tarda demasiado? Recarga la página. Si sigue sin aparecer, prueba con un navegador actualizado (Chrome, Edge, Firefox o Safari) y con JavaScript activado.</p>
      </div>
    </div>
    <noscript><div class="arranque"><h1>Cuándo Florece necesita JavaScript</h1><p>Activa JavaScript en tu navegador para ver el mapa de la floración, las fichas de los destinos y el planificador de viajes.</p></div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
